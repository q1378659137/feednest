services:
  feednest:
    container_name: ${CONTAINER_NAME}
    image: feednest:1.2.0
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:13786"
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime
    environment:
      - TZ=${TZ}
      - PORT=13786
      # 需要代理抓取 GitHub 等源时取消注释
      # - HTTPS_PROXY=http://host.docker.internal:10808
      # - HTTP_PROXY=http://host.docker.internal:10808
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      createdBy: "Apps"
    deploy:
      resources:
        limits:
          cpus: "${CPUS}"
          memory: ${MEMORY_LIMIT}

networks:
  1panel-network:
    external: true
