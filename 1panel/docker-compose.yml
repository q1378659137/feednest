services:
  feednest:
    image: feednest:1.2.0
    container_name: feednest
    restart: unless-stopped
    ports:
      - "${FEEDNEST_PORT:-13786}:13786"
    volumes:
      - ./data:/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - PORT=13786
      # 需要代理抓取 GitHub 等源时取消注释（宿主机上的代理）
      # - HTTPS_PROXY=http://host.docker.internal:10808
      # - HTTP_PROXY=http://host.docker.internal:10808
    extra_hosts:
      - "host.docker.internal:host-gateway"
